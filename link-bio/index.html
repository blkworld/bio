<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinc.</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.12), transparent 24rem),
          radial-gradient(circle at 82% 88%, rgba(255, 255, 255, 0.08), transparent 24rem),
          #050505;
        color: #f5f5f0;
        font-family: "JetBrains Mono", monospace;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        padding: 34px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(24px);
      }

      .profile {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 18px;
        margin-bottom: 32px;
      }

      .avatar {
        width: 78px;
        height: 78px;
        border-radius: 22px;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(46px, 10vw, 76px);
        line-height: 0.9;
        letter-spacing: -0.1em;
      }

      .links {
        display: grid;
        gap: 10px;
      }

      .link {
        display: grid;
        grid-template-columns: 44px 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 14px;
        color: #f5f5f0;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.055);
        transition: 180ms ease;
      }

      .link:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.095);
      }

      .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.1);
      }

      .icon svg {
        width: 18px;
        height: 18px;
        fill: #f5f5f0;
      }

      .title {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .arrow {
        color: rgba(245, 245, 240, 0.42);
        font-size: 18px;
      }

      footer {
        margin-top: 24px;
        padding-top: 18px;
        display: flex;
        justify-content: flex-end;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(245, 245, 240, 0.42);
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="card">
        <header class="profile">
          <img class="avatar" src="./profile.jpg" alt="Vinc." />
          <h1>Vinc.</h1>
        </header>

        <nav class="links">
          <a class="link" href="https://instagram.com/vincerenism" target="_blank" rel="noreferrer">
            <span class="icon">
              <svg viewBox="0 0 24 24">
                <path d="M7.8 2h8.4A5.8 5.8 0 0 1 22 7.8v8.4a5.8 5.8 0 0 1-5.8 5.8H7.8A5.8 5.8 0 0 1 2 16.2V7.8A5.8 5.8 0 0 1 7.8 2Zm-.2 2A3.6 3.6 0 0 0 4 7.6v8.8A3.6 3.6 0 0 0 7.6 20h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6A3.6 3.6 0 0 0 16.4 4H7.6Zm9.65 1.5a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/>
              </svg>
            </span>
            <span class="title">Instagram</span>
            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://tiktok.com/@vincerenism" target="_blank" rel="noreferrer">
            <span class="icon">
              <svg viewBox="0 0 24 24">
                <path d="M16.6 2c.25 2.2 1.48 3.52 3.4 3.66v3.28a6.92 6.92 0 0 1-3.36-1.05v6.4c0 4.12-2.78 6.71-6.35 6.71A6.13 6.13 0 0 1 4 14.86c0-3.77 3.18-6.55 6.92-6.14v3.42c-1.72-.26-3.25.84-3.25 2.64 0 1.52 1.12 2.6 2.55 2.6 1.59 0 2.65-.96 2.65-3.04V2h3.73Z"/>
              </svg>
            </span>
            <span class="title">TikTok</span>
            <span class="arrow">↗</span>
          </a>

          <a class="link" href="mailto:hello@example.com">
            <span class="icon">
              <svg viewBox="0 0 24 24">
                <path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Zm8 7.35L4 7.5V17h16V7.5l-8 4.85Zm0-2.35L18.5 7h-13L12 10Z"/>
              </svg>
            </span>
            <span class="title">Email</span>
            <span class="arrow">↗</span>
          </a>
        </nav>

        <footer>VINCERE AUT MORI</footer>
      </section>
    </main>
  </body>
</html>
